    OR
  - argc > 3: Provide more than 2 additional arguments (e.g., 3 or more arguments after the program name)

  Examples of valid invocations:
  - No arguments: just the program name (argc = 1)
  - One argument: program name + 1 argument (argc = 2)
  - Three arguments: program name + 3 arguments (argc = 4)
  - Four or more arguments: program name + 4+ arguments (argc >= 5)
