  Although it has 100% historical coverage, it represents an important edge case where
  the count of floats between start and end is small (≤ 20). This exercises the core
  counting logic with a smaller range and could reveal bugs in the floating-point
  iteration mechanism. Since all other branches also have 100% coverage, this branch
  is selected as it tests the most complex logic - the actual counting algorithm's
  behavior with tight bounds.
target_path_constraint: |-
  To reach the branch where `count <= FLOATS_BETWEEN_BUG` evaluates to true, the following constraints must be satisfied:

  1. **Command-Line Arguments**: The program must receive exactly 3 arguments (program name + 2 float arguments):
     - `argc == 3`

  2. **Argument Parsing**: The two command-line arguments (argv[1] and argv[2]) must be parseable as floating-point numbers by `atof()`:
     - `argv[1]` represents the start value
     - `argv[2]` represents the end value

  3. **NaN Validation**: Neither the start nor end values can be NaN (Not a Number):
     - `!isnan(start) AND !isnan(end)`

  4. **Ordering Constraint**: The start value must be less than or equal to the end value:
     - `start <= end`

  5. **Range Constraints**: The values must fall within the predefined bounds:
     - `start >= START_FLOAT` where START_FLOAT = 1.0
     - `end <= END_FLOAT` where END_FLOAT = 1.00001

  6. **Count Constraint**: The number of single-precision floating-point numbers between start (inclusive) and end (exclusive) must be at most 20:
     - The count is computed by iterating through floats using bit-level increment (treating the float's bit representation as an unsigned integer and incrementing it)
     - For the branch to be taken: `count <= 20` where FLOATS_BETWEEN_BUG = 20
     - This means the range [start, end) should contain at most 20 distinct float values
     - Since consecutive single-precision floats near 1.0 are very close together, this requires `end - start` to be very small
     - Specifically, the difference between start and end should be small enough that incrementing the bit representation of start at most 20 times reaches or exceeds end

  **Concrete constraint for count**: To ensure count ≤ 20, choose start and end such that there are at most 20 representable single-precision floats in the range [start, end). For example, if start = 1.0, then end should be the 21st or earlier float after 1.0 in the IEEE 754 single-precision representation.
