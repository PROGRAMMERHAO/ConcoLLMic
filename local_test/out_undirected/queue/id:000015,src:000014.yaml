target_path_constraint: |-
  To reach the branch where `count <= FLOATS_BETWEEN_BUG` evaluates to true (triggering the bug), the following constraints must be satisfied:

  1. **Command-line Arguments**: The program must receive exactly 3 arguments (the program name plus 2 float arguments):
     - `argc == 3`

  2. **Argument Parsing**: Both command-line arguments must be parseable as valid floating-point numbers:
     - `argv[1]` and `argv[2]` must be valid string representations of floats (not "nan", "inf", etc.)

  3. **NaN Check**: Neither parsed float can be NaN:
     - `!isnan(start)` AND `!isnan(end)`
     - Where `start = atof(argv[1])` and `end = atof(argv[2])`

  4. **Ordering Constraint**: The start value must not exceed the end value:
     - `start <= end`

  5. **Lower Bound Constraint**: The start value must be at least START_FLOAT (defined as 1.0):
     - `start >= 1.0`

  6. **Upper Bound Constraint**: The end value must not exceed END_FLOAT (defined as 1.00001):
     - `end <= 1.00001`

  7. **Count Constraint** (the critical constraint): The number of distinct single-precision floating-point values in the range [start, end) must be at most FLOATS_BETWEEN_BUG (defined as 20):
     - `count <= 20`
     
     Where `count` is computed by iterating through consecutive floating-point representations starting from `start` and incrementing the bit pattern (interpreted as unsigned integer) by 1 each time until reaching `end`.
     
     To satisfy this constraint, `start` and `end` must be very close together - specifically, there must be at most 20 representable float values between them. This means the difference between their bit representations (when interpreted as unsigned integers) must be at most 20.

  **Note on Float Representation**: The program counts floats by treating their IEEE 754 bit patterns as unsigned integers and incrementing. For the count to be <= 20, the unsigned integer representation of `end` minus the unsigned integer representation of `start` must be <= 20.
