  1. **Command-Line Arguments**: The program must receive exactly 3 arguments (program name + 2 float arguments):
     - `argc == 3`

  2. **Argument Parsing**: Both command-line arguments must be parseable as valid floating-point numbers:
     - `argv[1]` and `argv[2]` must be valid float string representations
     - After parsing: `start = atof(argv[1])` and `end = atof(argv[2])`

  3. **NaN Validation**: Neither parsed value can be NaN:
     - `!isnan(start) AND !isnan(end)`

  4. **Ordering Constraint**: Start must not exceed end:
     - `start <= end`

  5. **Range Constraints**: Both values must fall within the valid range:
     - `start >= START_FLOAT` (where START_FLOAT = 1.0)
     - `end <= END_FLOAT` (where END_FLOAT = 1.00001)

  6. **Loop Iteration Constraint**: The loop counts floating-point numbers from start (inclusive) to end (exclusive) by iterating through their bit representations. For the FALSE branch to be taken, we need:
     - `count > FLOATS_BETWEEN_BUG` (where FLOATS_BETWEEN_BUG = 20)
     
     This means there must be more than 20 distinct single-precision floating-point numbers in the range [start, end). Since the loop increments the bit representation of the float, the number of floats between start and end depends on their bit-level difference.
     
     To ensure count > 20, the inputs must satisfy:
     - `start < end` (strict inequality to ensure loop executes)
     - The bit-representation distance between start and end must be greater than 20
     
     In practical terms: choose start and end such that when start is converted to unsigned int (via memcpy), incremented 21+ times, and converted back to float, it still hasn't reached end.

  **Summary**: Provide two float values in [1.0, 1.00001] where start < end and there are more than 20 representable floats between them.
