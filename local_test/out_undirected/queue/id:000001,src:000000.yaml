target_path_constraint: |-
  To reach the branch where `count <= FLOATS_BETWEEN_BUG` evaluates to true:

  1. **Command-Line Arguments**: The program must receive exactly 3 arguments (program name + 2 float arguments):
     - `argc == 3`

  2. **Argument Parsing**: The two command-line arguments (argv[1] and argv[2]) must be parseable as floating-point numbers by `atof()`:
     - `start = atof(argv[1])` produces a valid float
     - `end = atof(argv[2])` produces a valid float

  3. **NaN Validation**: Neither start nor end can be NaN:
     - `!isnan(start) && !isnan(end)`

  4. **Ordering Constraint**: start must be less than or equal to end:
     - `start <= end`

  5. **Range Constraints**: Both values must be within the allowed range:
     - `start >= START_FLOAT` (where START_FLOAT = 1.0)
     - `end <= END_FLOAT` (where END_FLOAT = 1.00001)

  6. **Count Constraint**: The number of single-precision floating-point numbers between start (inclusive) and end (exclusive) must be at most 20:
     - The count is computed by iterating through floats using bit-level increment: starting from `start`, repeatedly converting to unsigned int, incrementing by 1, and converting back to float, until reaching `end`
     - This count must satisfy: `count <= 20` (where FLOATS_BETWEEN_BUG = 20)
     - To achieve this, the range [start, end) must be small enough that there are at most 20 distinct single-precision floats in between
     - For example, choosing start and end to be very close together (e.g., consecutive or near-consecutive floats) will result in a small count

  In summary: provide two command-line arguments representing floats in the range [1.0, 1.00001] where start <= end, and the number of representable single-precision floats from start (inclusive) to end (exclusive) is at most 20.
