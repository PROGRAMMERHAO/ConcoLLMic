          }
          else
          {
              repeats = 0;
              prev = pattern[i];
          }
      }

      // Check for short repeating sequences (ab, aba, abab, etc.)
      for (size_t seq_len = 2; seq_len <= pattern_len / 2; seq_len++)
      {
          bool is_repetitive = true;
          for (size_t i = seq_len; i < pattern_len; i++)
          {
              if (pattern[i] != pattern[i % seq_len])
              {
                  is_repetitive = false;
                  break;
              }
          }
          if (is_repetitive)
              return true;
      }

      return false;
  }

