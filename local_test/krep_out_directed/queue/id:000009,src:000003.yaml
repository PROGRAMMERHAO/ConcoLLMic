     - `line_start` is computed by `find_line_start(text_start, text_len, match_start_index)` (line 1551)
     - For the FIRST match found, `last_counted_line_start == SIZE_MAX`, so the condition is always true (since line_start will be a valid offset < SIZE_MAX)
     - For subsequent matches, the condition is true only if the match is on a different line than the previous counted match

  **Implication**: 
  - For the first match found by KMP, this branch will always be true (since last_counted_line_start starts at SIZE_MAX)
  - Therefore, if KMP finds at least one match, this branch will be reached

  **Minimal example**:
  - Command: `./krep -i -c aaaa <file>`
  - File content: "aaaa\n" (single line containing the pattern)
  - The first match will have line_start != SIZE_MAX, making the condition true
