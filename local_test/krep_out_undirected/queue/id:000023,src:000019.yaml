  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import tempfile

      # Modified to satisfy target path constraint:
      # 1. Use -E flag to enable regex mode (use_regex = true)
      # 2. Use -c flag to enable count mode (count_only_flag = true)
      # 3. Do NOT use -o flag (to keep only_matching = false)
      # 4. This results in count_lines_mode = true
      # 5. Provide a valid regex pattern
      # 6. File content contains matches to exercise line counting logic
      
      # Pattern: "ab" (valid POSIX Extended Regular Expression)
      pattern = "ab"
      
      # File content: readable content with matches
      file_data = "ab\ntest\nab\n"

      # create a temporary file
      with tempfile.NamedTemporaryFile(mode="w") as temp_file:
          # write file data to file
          temp_file.write(file_data)
          temp_file.flush()
          temp_file_path = temp_file.name
          try:
              # Command: ./krep -E -c "ab" temp_file_path
              # -E flag enables use_regex = true
              # -c flag enables count_only_flag = true
              # No -o flag means only_matching = false
              # Therefore count_lines_mode = count_only_flag && !only_matching = true
              # Pattern "ab" is a valid regex that will compile with regcomp()
              result = subprocess.run(
                  ["./krep", "-E", "-c", pattern, temp_file_path],
                  capture_output=True,
                  encoding="utf-8",
                  errors="replace",
                  timeout=timeout,
              )
              # return stderr and the returncode
              return result.stderr, result.returncode
          except subprocess.TimeoutExpired as e:
              # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
              return e.stderr, -signal.SIGKILL
          except Exception as e:
              # ensure to raise the error if run failed
              raise e
