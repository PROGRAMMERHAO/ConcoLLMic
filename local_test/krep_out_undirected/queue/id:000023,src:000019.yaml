  def execute_program(timeout: int) -> tuple[str, int]:
      import signal
      import subprocess
      import tempfile

      # Modified to satisfy target path constraint:
      # 1. Use -c flag to enable count_only_flag
      # 2. Do NOT use -o flag (to keep only_matching = false)
      # 3. This results in count_lines_mode = true
      # 4. Pattern must be 2 or 3 characters (< SHORT_PATTERN_THRESH = 4)
      # 5. Use -i flag to make case_sensitive = false, bypassing SIMD
      # 6. File content contains matches to exercise line counting logic
      
      # Pattern: "ab" (2 characters, satisfies length < 4)
      pattern = "ab"
      
      # File content: readable content with matches
      file_data = "ab\ntest\nab\n"

      # create a temporary file
      with tempfile.NamedTemporaryFile(mode="w") as temp_file:
          # write file data to file
          temp_file.write(file_data)
          temp_file.flush()
          temp_file_path = temp_file.name
          try:
              # Command: ./krep -c -i "ab" temp_file_path
              # -c flag enables count_only_flag = true
              # No -o flag means only_matching = false
              # Therefore count_lines_mode = true
              # -i flag makes case_sensitive = false, so SIMD is bypassed
              # Pattern "ab" has length 2 < 4 (SHORT_PATTERN_THRESH)
              # No -E flag (not regex), single pattern (no multiple -e)
              result = subprocess.run(
                  ["./krep", "-c", "-i", pattern, temp_file_path],
                  capture_output=True,
                  encoding="utf-8",
                  errors="replace",
                  timeout=timeout,
              )
              # return stderr and the returncode
              return result.stderr, result.returncode
          except subprocess.TimeoutExpired as e:
              # Timeout occurred, also ensure to return stderr captured before timeout and return code -signal.SIGKILL
              return e.stderr, -signal.SIGKILL
          except Exception as e:
              # ensure to raise the error if run failed
              raise e
