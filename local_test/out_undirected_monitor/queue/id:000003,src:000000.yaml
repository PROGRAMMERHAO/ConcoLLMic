  2. **Possible scenarios**:
     - argc < 3: Fewer than 2 arguments provided (e.g., 0 or 1 argument after program name)
       * Example: `./count` (argc = 1)
       * Example: `./count 1.0` (argc = 2)
     
     - argc > 3: More than 2 arguments provided (e.g., 3 or more arguments after program name)
       * Example: `./count 1.0 1.00001 extra` (argc = 4)
