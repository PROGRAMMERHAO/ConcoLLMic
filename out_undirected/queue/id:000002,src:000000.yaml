target_path_constraint: |-
  To reach the branch where `isnan(start) || isnan(end)` evaluates to true, the following constraints must be satisfied:

  1. **Command-Line Arguments**: The program must receive exactly 3 arguments (program name + 2 float arguments):
     - `argc == 3`

  2. **Argument Parsing and NaN Generation**: At least one of the two command-line arguments must be parsed by `atof()` to produce a NaN value:
     - `isnan(atof(argv[1])) OR isnan(atof(argv[2]))`

  3. **How to Generate NaN with atof()**: The `atof()` function in C can produce NaN when given certain string inputs. Common strings that produce NaN include:
     - "nan" (case-insensitive, so "NaN", "NAN", "nan" all work)
     - "inf" or "infinity" may produce infinity (not NaN), but some implementations may handle edge cases differently
     - Invalid numeric strings typically produce 0.0, not NaN
     
     Therefore, to satisfy this constraint, at least one of argv[1] or argv[2] should be a string that `atof()` interprets as NaN, such as "nan", "NaN", or "NAN".

  **Concrete requirement**: Either argv[1] or argv[2] (or both) should be a string representation that causes `atof()` to return NaN, such as "nan".
