target_path_constraint: |-
  To reach the branch where `start > end` evaluates to true, the following constraints must be satisfied:

  1. **Command-Line Arguments**: The program must receive exactly 3 arguments (program name + 2 float arguments):
     - `argc == 3`

  2. **Argument Parsing**: The two command-line arguments must be parseable as floating-point numbers by `atof()`:
     - `argv[1]` represents the start value
     - `argv[2]` represents the end value

  3. **NaN Validation**: Neither start nor end can be NaN:
     - `!isnan(start) AND !isnan(end)`
     - This means argv[1] and argv[2] should be valid numeric strings (not "nan" or similar)

  4. **Ordering Constraint**: Start must be strictly greater than end:
     - `start > end`
     - This means the first command-line argument (argv[1]) must represent a floating-point value that is numerically greater than the second command-line argument (argv[2])

  **Example**: Providing arguments like "2.0" and "1.0" would satisfy this constraint, as start=2.0 > end=1.0.
